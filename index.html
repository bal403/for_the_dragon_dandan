<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>faye 🫶</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #faf6f0;
            background-image: radial-gradient(#e5dcd3 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }
        .book-wrapper {
            perspective: 1200px;
            width: 100%;
            max-width: 950px;
        }
        
        /* PAGE 1: COVER / LARGE PHOTO ALBUM SCREEN */
        .cover-page {
            background: #ffffff;
            border: 4px solid #2b2b2b;
            box-shadow: 8px 8px 0px #2b2b2b;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cover-title {
            margin-bottom: 20px;
        }
        .cover-title h1 {
            font-size: 24px;
            color: #2b2b2b;
            text-transform: uppercase;
            font-weight: 900;
        }
        .cover-title span {
            background: #ffb3c1;
            padding: 4px 12px;
            border: 2px solid #2b2b2b;
            box-shadow: 2px 2px 0px #2b2b2b;
            display: inline-block;
            margin-top: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        
        /* PHOTO ALBUM GRID FOR 20 PICS & 15 GIFS */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 2px dashed #2b2b2b;
            border-radius: 8px;
            background: #fffdfa;
        }
        .gallery-item {
            background: white;
            padding: 5px 5px 15px 5px;
            border: 2px solid #2b2b2b;
            box-shadow: 2px 2px 0px #2b2b2b;
            transition: transform 0.2s ease;
        }
        .gallery-item:nth-child(3n) { transform: rotate(-2deg); }
        .gallery-item:nth-child(3n+1) { transform: rotate(3deg); }
        .gallery-item:nth-child(3n+2) { transform: rotate(-1deg); }
        .gallery-item img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border: 1px solid #e5dcd3;
            display: block;
        }
        .gallery-gif {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fffdf9;
        }
        .gallery-gif img {
            object-fit: contain;
            border: none;
            max-height: 75px;
        }

        /* PAGE 2: MAIN SCRAPBOOK CONTAINER */
        .scrapbook-container {
            display: none;
            flex-direction: row;
            width: 100%;
            background: #ffffff;
            border: 4px solid #2b2b2b;
            box-shadow: 8px 8px 0px #2b2b2b;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        .scrapbook-container.active-page {
            display: flex;
            animation: pageTransition 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }
        .scrapbook-container::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 6px;
            background: linear-gradient(90deg, rgba(0,0,0,0.15), rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.0) 70%, rgba(0,0,0,0.15));
            border-left: 1px dashed #2b2b2b;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
        }
        .page-left {
            width: 50%;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fffdf9;
            position: relative;
            overflow: hidden;
        }
        .page-right {
            width: 50%;
            background: #fffdf9;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .letter-head {
            margin-bottom: 15px;
        }
        .letter-head h1 {
            font-size: 22px;
            color: #2b2b2b;
            text-transform: uppercase;
            font-weight: 900;
        }
        .letter-head span {
            background: #ffb3c1;
            padding: 2px 8px;
            border: 2px solid #2b2b2b;
            box-shadow: 2px 2px 0px #2b2b2b;
            display: inline-block;
            margin-top: 5px;
            font-weight: bold;
            font-size: 13px;
        }
        .quiz-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
            animation: bookFlipPage 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }
        .step label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #2b2b2b;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .custom-field {
            width: 100%;
            padding: 12px;
            border: 2px solid #2b2b2b;
            border-radius: 6px;
            font-size: 14px;
            background: #fafafa;
            color: #2b2b2b;
            outline: none;
            -webkit-appearance: none;
        }
        .custom-field:focus {
            background: #fff;
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.1);
        }
        textarea.custom-field {
            resize: none;
            height: 90px;
        }
        .nav-zone {
            margin-top: 15px;
        }
        .btn-turn {
            background: #ff6b6b;
            color: #fff;
            border: 2px solid #2b2b2b;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 3px 3px 0px #2b2b2b;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-turn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #2b2b2b;
        }
        
        /* POLAROID FRAME AT SLIDESHOW */
        .polaroid-frame {
            background: white;
            padding: 10px 10px 25px 10px;
            border: 2px solid #2b2b2b;
            box-shadow: 4px 4px 0px #2b2b2b;
            transform: rotate(-2deg);
            width: 100%;
            max-width: 220px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .polaroid-frame img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border: 1px solid #e5dcd3;
            display: block;
        }
        .gif-frame {
            background: white;
            padding: 8px;
            border: 2px solid #2b2b2b;
            box-shadow: 3px 3px 0px #2b2b2b;
            transform: rotate(3deg);
            width: 100%;
            max-width: 160px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .gif-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* MUSIC CONTROL DESIGN */
        #music-ctrl-btn {
            background: #ffb3c1;
            color: #2b2b2b;
            border: 2px solid #2b2b2b;
            box-shadow: 3px 3px 0px #2b2b2b;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 20px;
            margin-bottom: 5px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        #music-ctrl-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #2b2b2b;
        }
        .audio-holder {
            display: none;
        }

        /* ANIMATIONS */
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes pageTransition {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes bookFlipPage {
            0% { opacity: 0.4; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* MOBILE RESPONSIVE MEDIA QUERIES */
        @media (max-width: 680px) {
            body {
                padding: 5px;
                align-items: flex-start;
            }
            .cover-page {
                padding: 15px;
                border-radius: 12px;
            }
            .cover-title h1 {
                font-size: 20px;
            }
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
                max-height: 320px;
                gap: 6px;
                padding: 5px;
            }
            .gallery-item img {
                height: 75px;
            }
            .gallery-gif img {
                max-height: 60px;
            }
            .scrapbook-container {
                flex-direction: column;
                border-radius: 12px;
            }
            .scrapbook-container::before {
                display: none;
            }
            .page-left, .page-right {
                width: 100%;
                padding: 20px 15px;
            }
            .page-left {
                border-bottom: 3px dashed #2b2b2b;
            }
            .page-right {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 10px;
            }
            .polaroid-frame {
                max-width: 45%;
                padding: 6px 6px 15px 6px;
            }
            .polaroid-frame img {
                height: 110px;
            }
            .gif-frame {
                max-width: 45%;
                height: 90px;
            }
            #music-ctrl-btn {
                width: 100%;
                justify-content: center;
                margin-bottom: 5px;
            }
        }
    </style>
</head>

<script>
    const poolPhotos = [
        "pic1.jpeg", "pic2.jpeg", "pic3.jpeg", "pic4.jpeg", 
        "pic5.jpeg", "pic6.jpg", "pic7.jpeg", "pic8.jpeg", "pic9.jpeg", 
        "pic10.jpeg", "pic11.jpeg", "pic12.jpeg", "pic13.jpeg", "pic14.jpeg", 
        "pic15.jpeg", "pic16.jpeg"
    ];

    const poolGifs = [
        "gif1.gif", "gif2.gif", "gif3.gif", "gif4.gif", "gif5.gif", 
        "gif6.gif", "gif7.gif", "gif8.gif", "gif9.gif", "gif10.gif", 
        "gif11.gif", "gif12.gif", "gif13.gif", "gif14.gif", "gif15.gif"
    ];

    const soundTrack = document.getElementById("love-track");
    const photoFrame = document.getElementById("slideshow-frame");
    const notebookPolaroid = document.getElementById("photo-notebook");

    function forcePlay() {
        if (soundTrack.paused) {
            soundTrack.play().then(() => {
                const btn = document.getElementById("music-ctrl-btn");
                if(btn) {
                    btn.innerText = "⏸️ Pause Music";
                    btn.style.background = "#42b72a";
                    btn.style.color = "#fff";
                }
            }).catch(() => console.log("Audio pipeline initialized."));
        }
    }

    function toggleMusic() {
        const btn = document.getElementById("music-ctrl-btn");
        if (soundTrack.paused) {
            soundTrack.play()
                .then(() => {
                    btn.innerText = "⏸️ Pause Music";
                    btn.style.background = "#42b72a";
                    btn.style.color = "#fff";
                })
                .catch(err => console.log("Audio trigger blocked:", err));
        } else {
            soundTrack.pause();
            btn.innerText = "🎵 Play Music";
            btn.style.background = "#ffb3c1";
            btn.style.color = "#2b2b2b";
        }
    }

    function openOurBook() {
        forcePlay();
        document.getElementById("view-cover").style.display = "none";
        document.getElementById("view-book").classList.add("active-page");
    }

    function syncPage(stepNum, photoIndex, gifIndex) {
        forcePlay();
        if(poolPhotos[photoIndex]) {
            photoFrame.src = poolPhotos[photoIndex];
            const randomTilt = (Math.random() * 8 - 4).toFixed(2);
            notebookPolaroid.style.transform = `rotate(${randomTilt}deg) scale(1.02)`;
            setTimeout(() => {
                notebookPolaroid.style.transform = `rotate(${randomTilt}deg) scale(1)`;
            }, 200);
        }
        if(poolGifs[gifIndex]) {
            document.getElementById("gif-loader").src = poolGifs[gifIndex];
        }
    }

    function nextStep(current, next) {
        document.getElementById("step" + current).classList.remove("active");
        document.getElementById("step" + next).classList.add("active");
        syncPage(next, next % poolPhotos.length, next % poolGifs.length);
    }

    function prevStep(current, prev) {
        document.getElementById("step" + current).classList.remove("active");
        document.getElementById("step" + prev).classList.add("active");
        syncPage(prev, prev % poolPhotos.length, prev % poolGifs.length);
    }

    function setDecision(value) {
        document.getElementById("final-decision").value = value;
    }

    let crashCount = 0;

            yesBtn.style.background = "#ff6b6b";
